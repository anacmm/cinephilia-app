name: Cinephilia App CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Run tests
        run: ./gradlew test

      - name: Verify PostgreSQL migrations and application startup
        env:
          DB_NAME: castquest_ci
        run: |
          export DB_PASSWORD="$(openssl rand -hex 24)"
          export POSTGRES_PASSWORD="$DB_PASSWORD"
          echo "::add-mask::$DB_PASSWORD"
          trap 'docker compose -p castquest-ci down --volumes' EXIT
          docker compose -p castquest-ci up -d --wait postgres
          ./gradlew databaseTest

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar
